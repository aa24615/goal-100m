services:
  db:
    image: postgres:15-alpine
    # 2026-11-03 修复：原先 unless-stopped 在 Docker Desktop 关闭/重启后不会自动拉起
    # （容器收到 SIGTERM → installProcessGuards 优雅退出 0，Desktop 将其记为「已停止」），
    # 实测 11-02 21:09 起生产停摆约 4 小时、11-03 全天无 app 日志。改为 always：
    # daemon 恢复后无条件拉起，避免把「服务没在跑」误读成「日志干净无异常」。
    restart: always
    environment:
      POSTGRES_USER: papertrade
      POSTGRES_PASSWORD: papertrade
      POSTGRES_DB: papertrade
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papertrade -d papertrade"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://papertrade:papertrade@db:5432/papertrade
      # JWT_SECRET 必须由根目录 .env 提供（勿提交到仓库）。
      # 这里的兜底值只是为了让 compose 能启动；配合下面的 NODE_ENV=production，
      # auth.js 的 resolveSecret() 会在密钥缺失/仍是占位值时直接抛错退出，
      # 而不是退回「可伪造 token 的公开密钥」静默运行。
      JWT_SECRET: ${JWT_SECRET:-please-change-this-secret}
      # 开启生产模式：默认密钥将被拒绝（fail-closed），并关闭重置令牌的明文回显
      NODE_ENV: production
      PORT: 3001
      TICK_MS: 2000
      SNAPSHOT_MS: 60000
      # 行情引擎：一个交易日包含的 tick 数、收盘后休市 tick 数、隔夜跳空波动率、盘中波动率
      SESSION_TICKS: ${SESSION_TICKS:-120}
      SESSION_BREAK_TICKS: ${SESSION_BREAK_TICKS:-5}
      GAP_SIGMA: ${GAP_SIGMA:-0.015}
      INTRADAY_VOL: ${INTRADAY_VOL:-0.0012}
      PERSIST_EVERY_TICKS: ${PERSIST_EVERY_TICKS:-5}
      # 设为 1 则按真实时钟 9:30-11:30 / 13:00-15:00 开市（真实行情数据的推荐模式）
      REAL_CLOCK: ${REAL_CLOCK:-1}
      # T+1 当日买入不可卖（设为 0 关闭）
      T1_ENABLED: ${T1_ENABLED:-1}
      PRICE_TOLERANCE: ${PRICE_TOLERANCE:-0.005}
      # 跨域白名单，多个用逗号分隔；留空表示仅允许同源
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      TZ: Asia/Shanghai
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_DIR: /app/logs
      # RQ-160：责任人必须能在**容器内**被断言，只在仓库根的 .env 里写是不够的
      # （compose 只把 .env 当变量来源，不会自动透传未声明的键）
      PUBLIC_ENTRY_OWNER: ${PUBLIC_ENTRY_OWNER:-}
      PUBLIC_ENTRY_DEADLINE: ${PUBLIC_ENTRY_DEADLINE:-}
      # RQ-156：对外地址（分享链接与回调的唯一落点）
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
    volumes:
      - ./backend/logs:/app/logs
    expose:
      - "3001"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
